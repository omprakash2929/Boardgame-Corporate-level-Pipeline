version: "3.8"

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data: {}
  grafana_data: {}

services:

  # ── Prometheus: collects and stores metrics ─────────────────────
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    networks:
      - monitoring

  # ── Node Exporter: exposes host machine metrics (CPU/RAM/disk) ──
  node_exporter:
    image: prom/node-exporter:v1.12.0
    container_name: node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - monitoring

  # ── Blackbox Exporter: probes URLs/endpoints (up/down, latency) ─
  blackbox_exporter:
    image: prom/blackbox-exporte
